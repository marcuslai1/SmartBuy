# GitHub Actions workflow for deploying SmartBuy to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Run on push to main branch
  push:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Build static phone data
        run: |
          python build_static_data.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smartbuy-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: smartbuy-frontend
        run: npm ci

      - name: Build frontend
        working-directory: smartbuy-frontend
        env:
          # Set base URL to repo name - UPDATE THIS to your repo name!
          VITE_BASE_URL: /Scraper/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: smartbuy-frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
